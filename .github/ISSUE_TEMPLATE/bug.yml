name: Problem / regression
description: Report a reproducible problem in the architecture, templates, or learning loop.
title: "[Problem]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the Ideal Self Coworker have done instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic/non-sensitive examples where possible.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Correctness, retrieval, evaluation, privacy/security, maintenance, or other impact.
  - type: checkboxes
    id: sensitive
    attributes:
      label: Privacy check
      options:
        - label: I have removed secrets, personal data, and employer/client-confidential information.
          required: true
